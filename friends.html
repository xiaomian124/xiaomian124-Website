  <script>
  (function () {
  try {
      var pref = localStorage.getItem('theme') || 'auto';
      var isDark = pref === 'dark'
      || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-pref', pref);

      if (localStorage.getItem('bg') === 'off') {
      document.documentElement.setAttribute('data-bg', 'off');
      } else {
      document.documentElement.setAttribute('data-bg', 'on');
      document.documentElement.style.setProperty(
          '--bing-bg',
          'url("https://guestbook.xiaomian124.top/api/bing")'
      );
      }
  } catch (e) {}
  })();
  </script>

      <nav class="nav-links">

      <div class="theme-menu-wrap">

              <span class="theme-menu-icon" style="--icon: url('/assets/icons/sun.svg')"></span> 亮色

  <main class="container">

    <div class="friends-head">
      <div>
        <h1 class="page-title">好友</h1>
        <p class="page-sub">我的一些开发者好友</p>
      </div>
      <div class="friends-search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="friendSearch" placeholder="搜索好友…" autocomplete="off">
      </div>
    </div>

    <div class="friend-grid" id="friendGrid">

      <div class="friend-card" data-name="songline-music songline music">
        <img class="friend-avatar" src="assets/friends/ZngZhi.png" alt=""
             onerror="this.src='assets/user.svg'">
        <div class="friend-body">
          <h3 class="friend-name">ZngZhi</h3>
          <p class="friend-desc">喜欢研究电路板块，模块编辑</p>
        </div>
        <a class="friend-btn" href="https://github.com/ZngZhi" target="_blank" rel="noopener">
          访问主页
        </a>
      </div>

      <div class="friend-card" data-name="songline-music songline music">
        <img class="friend-avatar" src="assets/friends/ckckh2023.jpg" alt=""
             onerror="this.src='assets/user.svg'">
        <div class="friend-body">
          <h3 class="friend-name">ckckh2023</h3>
          <p class="friend-desc">一位资深服主，喜欢研究网页以及开发新项目。我参考了他的博客网站</p>
        </div>
        <a class="friend-btn" href="https://xiao-blog.top/" target="_blank" rel="noopener">
          访问主页
        </a>
      </div>

    </div>

    <p class="friend-empty" id="friendEmpty" hidden>没有找到匹配的好友。</p>

    <div class="friend-cta">
      <p>想出现在这里？去 <a href="guestbook.html">留言板</a> 或 <a href="about.html#contact">联系我</a> 吧。</p>
    </div>

  </main>

  <footer class="site-footer">

  </footer>

  <script src="js/main.js"></script>
  <script>
  (function () {
    const search = document.getElementById('friendSearch');
    const grid = document.getElementById('friendGrid');
    const empty = document.getElementById('friendEmpty');
    const cards = [...grid.querySelectorAll('.friend-card')];

    const cardTexts = cards.map(card => {
      const name = (card.querySelector('.friend-name')?.textContent || '');
      const desc = (card.querySelector('.friend-desc')?.textContent || '');
      const dataName = (card.dataset.name || '');
      return (name + ' ' + desc + ' ' + dataName).toLowerCase();
    });

    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach((card, i) => {
        const match = !q || cardTexts[i].includes(q);
        card.hidden = !match;
        if (match) visible++;
      });
      empty.hidden = visible > 0;
    });
  })();
  </script>
</body>
