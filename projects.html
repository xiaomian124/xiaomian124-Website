<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一只猫 · 项目</title>

  <script>
  (function () {
  try {
      var pref = localStorage.getItem('theme') || 'auto';
      var isDark = pref === 'dark'
      || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-pref', pref);

      if (localStorage.getItem('bg') === 'off') {
      document.documentElement.setAttribute('data-bg', 'off');
      } else {
      document.documentElement.setAttribute('data-bg', 'on');
      document.documentElement.style.setProperty(
          '--bing-bg',
          'url("https://guestbook.xiaomian124.top/api/bing")'
      );
      }
  } catch (e) {}
  })();
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/head.jpg">
  <link rel="alternate" type="application/rss+xml" title="一只猫" href="/rss.xml">
</head>

          </svg>
        </button>

          </div>

            <button type="button" class="theme-menu-item" data-bg-option="on">
              <span class="theme-menu-icon" style="--icon: url('/assets/icons/image.svg')"></span> Bing 聚焦
            </button>
            <button type="button" class="theme-menu-item" data-bg-option="off">
