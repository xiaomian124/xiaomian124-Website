        var saved = localStorage.getItem('theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- ============ Giscus 留言板 ============ -->
  <script src="https://giscus.app/client.js"
          data-repo="xiaomian124/xiaomian124-Website"
          data-repo-id="R_kgDOU7jcQQ"
          data-category="公告"
          data-category-id="DIC_kwDOU7jcQc4DHB0h"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="dark"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>

  <script>
    /* =========================================================
       Giscus 主题同步：跟随网站的深浅色切换
       ========================================================= */
    (function () {
      const GISCUS_LIGHT = 'light';
      const GISCUS_DARK  = 'dark';

      function currentGiscusTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark'
          ? GISCUS_DARK
          : GISCUS_LIGHT;
      }

      /* 向 Giscus iframe 发送主题变更消息 */
      function sendThemeToGiscus(theme) {
        const iframe = document.querySelector('iframe.giscus-frame');
        if (!iframe || !iframe.contentWindow) return;

        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme } } },
          'https://giscus.app'
        );
      }

      /* 监听网站主题变化：点击主题按钮后，同步 Giscus */
      const observer = new MutationObserver(() => {
        sendThemeToGiscus(currentGiscusTheme());
      });
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });

      /* Giscus iframe 加载完成后，主动同步一次初始主题
         （因为 HTML 里写死的是 dark，如果用户当前是浅色需要纠正） */
      window.addEventListener('message', (e) => {
        if (e.origin !== 'https://giscus.app') return;
        if (!e.data || !e.data.giscus) return;
        // 收到 Giscus 的 ready 信号后再发主题
        sendThemeToGiscus(currentGiscusTheme());
      });
    })();
  </script>
