<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一只猫 · 留言</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/head.jpg">
</head>
<body>

  <header class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a class="brand" href="index.html">一只猫</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="projects.html">项目</a>
        <a href="https://docs.xiaomian124.top/">文档</a>
        <a href="share.html">分享</a>
        <a href="guestbook.html" class="is-active">留言</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换深浅色主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1 class="page-title">留言板</h1>
      <p class="page-sub">插件建议、项目建议、报告 BUG 或者只是路过打个招呼，都欢迎。</p>
    </div>

    <section class="panel">
      <div class="section-title"><span>发表留言</span></div>

      <form class="guest-form" id="commentForm">
        <div class="reply-hint" id="replyHint" hidden>
          正在回复 <strong class="reply-target-name"></strong>
          <button type="button" class="reply-cancel" id="replyCancel">取消</button>
        </div>

        <div class="form-row">
          <input class="form-input" type="text" id="nickname"
                 placeholder="昵称" maxlength="20" required>
          <input class="form-input" type="text" id="qq"
                 placeholder="QQ（可选，用于头像）" maxlength="12">
        </div>

        <div class="md-editor">
          <div class="md-toolbar">
            <button type="button" class="md-btn" data-md="h" title="标题">H</button>
            <button type="button" class="md-btn" data-md="b" title="粗体"><b>B</b></button>
            <button type="button" class="md-btn" data-md="i" title="斜体"><i>I</i></button>
            <button type="button" class="md-btn" data-md="s" title="删除线"><s>I</s></button>
            <button type="button" class="md-btn" data-md="code" title="代码">&lt;&gt;</button>
            <button type="button" class="md-btn md-btn-link" data-md="link" title="链接">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
            </button>

            <button type="button" class="md-btn md-btn-preview" id="previewToggle" title="预览">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span class="md-btn-preview-text">预览</span>
            </button>

            <span class="md-tip">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m6 8 4 4-4 4"/>
                <path d="M12 16h6"/>
              </svg>
              留言板支持 Markdown 格式
            </span>
          </div>

          <textarea class="form-textarea" id="content" rows="6"
                    placeholder="留言内容（最多 1000 字，支持 Markdown）"
                    maxlength="1000" required></textarea>

          <div class="md-preview" id="previewArea" hidden>
            <p class="md-preview-empty" id="previewEmpty">这里还没有内容！</p>
            <div class="md-content" id="previewContent"></div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="submitBtn">提交留言</button>
          <span class="form-hint" id="formHint"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="section-title">
        <span>全部留言</span>
        <span class="plugin-count" id="commentCount"></span>
      </div>
      <div class="note-list" id="commentsList">
        <p class="repo-loading">正在加载留言…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made by xiaomian124</p>
    <p>
      Copyright © <span id="year"></span> xiaomian124-Website
    </p>
  </footer>

  <script src="js/main.js"></script>
  <script>
  (function () {
    const API = 'https://guestbook.xiaomian124.top';

    const form = document.getElementById('commentForm');
    const list = document.getElementById('commentsList');
    const hint = document.getElementById('formHint');
    const submitBtn = document.getElementById('submitBtn');
    const countEl = document.getElementById('commentCount');
    const replyHint = document.getElementById('replyHint');
    const replyName = replyHint.querySelector('.reply-target-name');

    let replyTo = null;

    /* ---------- 工具 ---------- */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatTime(iso) {
      const date = new Date(iso.replace(' ', 'T') + 'Z');
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      if (diff < 2592000) return Math.floor(diff / 86400) + ' 天前';
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    /* ---------- Markdown 渲染 ---------- */
    function renderMarkdown(text) {
      if (!text) return '';
      const html = marked.parse(text, { breaks: true, gfm: true });
      return DOMPurify.sanitize(html, {
        ALLOWED_TAGS: [
          'p', 'br', 'strong', 'em', 'del', 'code', 'pre',
          'a', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
          'ul', 'ol', 'li', 'blockquote', 'hr'
        ],
        ALLOWED_ATTR: ['href', 'target', 'rel']
      });
    }

    /* ---------- 头像 ---------- */
    const USER_ICON = 'assets/user.svg';

    function avatarHtml(qq) {
      const src = qq
        ? `https://q2.qlogo.cn/headimg_dl?dst_uin=${encodeURIComponent(qq)}&spec=100`
        : USER_ICON;
      return `<img class="note-avatar-img" src="${src}" alt=""
              onerror="this.onerror=null;this.src='${USER_ICON}'">`;
    }

    /* ---------- 渲染留言列表 ---------- */
    function renderComments(comments) {
      if (!comments.length) {
        list.innerHTML = '<p class="repo-empty">还没有留言，快来抢沙发吧！</p>';
        countEl.textContent = '';
        return;
      }
      countEl.textContent = `共 ${comments.length} 条`;

      list.innerHTML = comments.map(c => {
        const upActive = c.my_vote === 1 ? ' is-active' : '';
        const downActive = c.my_vote === -1 ? ' is-active' : '';

        const replyBlock = c.reply_nickname
          ? `<div class="reply-quote">
              <span class="reply-quote-name">@${escapeHtml(c.reply_nickname)}</span>
              <span class="reply-quote-text">${escapeHtml((c.reply_content || '').slice(0, 100))}</span>
            </div>`
          : '';

        const deleteBtn = c.is_mine
          ? `<button class="note-action note-delete" data-id="${c.id}">删除</button>`
          : '';

        return `
          <div class="note-card" data-id="${c.id}">
            <div class="note-head">
              ${avatarHtml(c.qq)}
              <span class="note-name">${escapeHtml(c.nickname)}</span>
              <span class="note-time">${formatTime(c.created_at)}</span>
            </div>
            ${replyBlock}
            <div class="note-text md-content">${renderMarkdown(c.content)}</div>
            <div class="note-actions">
              <button class="note-action note-vote note-up${upActive}" data-id="${c.id}" data-vote="1">
                <span class="note-vote-icon note-vote-icon-up"></span>
                <span>${c.upvotes}</span>
              </button>
              <button class="note-action note-vote note-down${downActive}" data-id="${c.id}" data-vote="-1">
                <span class="note-vote-icon note-vote-icon-down"></span>
                <span>${c.downvotes}</span>
              </button>
              <button class="note-action note-reply-btn" data-id="${c.id}" data-name="${escapeHtml(c.nickname)}">回复</button>
              ${deleteBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    /* ---------- API ---------- */
    async function loadComments() {
      try {
        const res = await fetch(`${API}/api/comments`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        renderComments(await res.json());
      } catch (err) {
        list.innerHTML = `<p class="repo-error">加载失败：${escapeHtml(err.message)}</p>`;
      }
    }

    async function submitComment(e) {
      e.preventDefault();
      const nickname = document.getElementById('nickname').value.trim();
      const qq = document.getElementById('qq').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!nickname || !content) {
        showHint('昵称和内容不能为空', false); return;
      }
      if (qq && !/^\d{5,12}$/.test(qq)) {
        showHint('QQ 号必须是 5-12 位数字', false); return;
      }
      if (content.length > 1000) {
        showHint('留言内容不能超过 1000 字', false); return;
      }

      submitBtn.disabled = true;
      showHint('正在提交…', null);

      try {
        const res = await fetch(`${API}/api/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, qq: qq || null, content, reply_to: replyTo })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '提交失败');

        showHint('留言成功！', true);
        form.reset();
        updateSubmitState();
        cancelReply();
        loadComments();
      } catch (err) {
        showHint(err.message, false);
      } finally {
        updateSubmitState();
      }
    }

    function showHint(text, ok) {
      hint.textContent = text;
      hint.style.color = ok === true ? '#16a34a' : ok === false ? '#ef4444' : '';
    }

    function startReply(id, name) {
      replyTo = id;
      replyName.textContent = name;
      replyHint.hidden = false;
      document.getElementById('content').focus();
    }

    function cancelReply() {
      replyTo = null;
      replyHint.hidden = true;
      replyName.textContent = '';
    }

    async function deleteComment(id) {
      if (!confirm('确定要删除这条留言吗？')) return;
      try {
        const res = await fetch(`${API}/api/comments/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '删除失败');
        loadComments();
      } catch (err) {
        alert('删除失败：' + err.message);
      }
    }

    async function voteComment(id, vote) {
      try {
        const res = await fetch(`${API}/api/comments/${id}/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vote })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '投票失败');

        const card = list.querySelector(`.note-card[data-id="${id}"]`);
        if (!card) return;
        const upBtn = card.querySelector('.note-up');
        const downBtn = card.querySelector('.note-down');
        upBtn.querySelector('span:last-child').textContent = data.upvotes;
        downBtn.querySelector('span:last-child').textContent = data.downvotes;
        upBtn.classList.toggle('is-active', data.my_vote === 1);
        downBtn.classList.toggle('is-active', data.my_vote === -1);
      } catch (err) {
        alert('投票失败：' + err.message);
      }
    }

    /* ---------- Markdown 工具栏 ---------- */
    function insertMarkdown(type) {
      const ta = document.getElementById('content');
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const selected = ta.value.slice(start, end);
      const before = ta.value.slice(0, start);
      const after = ta.value.slice(end);

      let insert = '';
      let cursor = 0;

      switch (type) {
        case 'h':
          insert = '## ' + (selected || '标题');
          cursor = insert.length;
          break;
        case 'b':
          insert = '**' + (selected || '粗体') + '**';
          cursor = selected ? insert.length : 2;
          break;
        case 'i':
          insert = '*' + (selected || '斜体') + '*';
          cursor = selected ? insert.length : 1;
          break;
        case 's':
          insert = '~~' + (selected || '删除线') + '~~';
          cursor = selected ? insert.length : 2;
          break;
        case 'code':
          if (selected.includes('\n')) {
            insert = '```\n' + selected + '\n```';
            cursor = insert.length;
          } else {
            insert = '`' + (selected || '代码') + '`';
            cursor = selected ? insert.length : 1;
          }
          break;
        case 'link':
          insert = '[' + (selected || '链接文字') + '](https://)';
          cursor = selected ? insert.length - 9 : insert.length - 9;
          break;
      }

      ta.value = before + insert + after;
      ta.focus();
      ta.setSelectionRange(start + cursor, start + cursor);
    }

    document.querySelectorAll('.md-btn').forEach(btn => {
      btn.addEventListener('click', () => insertMarkdown(btn.dataset.md));
    });

    /* ---------- 事件委托 ---------- */
    list.addEventListener('click', (e) => {
      const voteBtn = e.target.closest('.note-vote');
      if (voteBtn) {
        voteComment(voteBtn.dataset.id, Number(voteBtn.dataset.vote));
        return;
      }
      const replyBtn = e.target.closest('.note-reply-btn');
      if (replyBtn) {
        startReply(Number(replyBtn.dataset.id), replyBtn.dataset.name);
        return;
      }
      const delBtn = e.target.closest('.note-delete');
      if (delBtn) {
        deleteComment(Number(delBtn.dataset.id));
      }
    });

    document.getElementById('replyCancel').addEventListener('click', cancelReply);
    form.addEventListener('submit', submitComment);

    const contentEl = document.getElementById('content');
    const nicknameEl = document.getElementById('nickname');

    function updateSubmitState() {
      const hasContent = contentEl.value.trim().length > 0;
      const hasNickname = nicknameEl.value.trim().length > 0;
      submitBtn.disabled = !(hasContent && hasNickname);
    }

    contentEl.addEventListener('input', updateSubmitState);
    nicknameEl.addEventListener('input', updateSubmitState);
    updateSubmitState();

    /* ---------- Markdown 预览 ---------- */
    (function initPreview() {
      const toggle = document.getElementById('previewToggle');
      const previewArea = document.getElementById('previewArea');
      const previewContent = document.getElementById('previewContent');
      const previewEmpty = document.getElementById('previewEmpty');
      const contentEl = document.getElementById('content');
      const btnText = toggle.querySelector('.md-btn-preview-text');

      let previewing = false;

      function showPreview() {
        const text = contentEl.value.trim();
        if (text) {
          previewContent.innerHTML = renderMarkdown(text);
          previewContent.hidden = false;
          previewEmpty.hidden = true;
        } else {
          previewContent.innerHTML = '';
          previewContent.hidden = true;
          previewEmpty.hidden = false;
        }
        contentEl.hidden = true;
        previewArea.hidden = false;
        btnText.textContent = '编辑';
        toggle.classList.add('is-active');
        previewing = true;
      }

      function hidePreview() {
        contentEl.hidden = false;
        previewArea.hidden = true;
        btnText.textContent = '预览';
        toggle.classList.remove('is-active');
        previewing = false;
        contentEl.focus();
      }

      toggle.addEventListener('click', () => {
        previewing ? hidePreview() : showPreview();
      });
    })();

    loadComments();
  })();
  </script>
</body>
</html>
